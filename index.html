<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PocketBench — simulateur de travaux pratiques d'électricité : HMO2024, HMF2550, HMP2030, HMC8012 et plaque Hirschmann.">
<meta name="theme-color" content="#0b5cad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PocketBench">
<title>PocketBench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b5cad'/%3E%3Cpath d='M5 17c3-9 6-9 8 0s5 9 8 0 5-9 6-4' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* PocketBench */
:root { --f: "Barlow", "Segoe UI", system-ui, sans-serif; --fc: "Barlow Semi Condensed", "Arial Narrow", "Barlow", sans-serif; }
:root[data-theme="light"] { --bg: #e3e7ea; --mat: #c3ccd1; --mat2: #bac4ca; --matl: rgba(24, 52, 70, .07); --chrome: #f7f8f9; --chrome2: #edf0f2; --ink: #17202a; --ink2: #5b6672; --line: #d4d9de; --accent: #0b5cad; --accent-ink: #fff; --warn: #a96200; --danger: #c62828; --hover: rgba(11, 92, 173, .08); color-scheme: light; }
:root[data-theme="dark"] { --bg: #0f1418; --mat: #1d252b; --mat2: #192026; --matl: rgba(255, 255, 255, .035); --chrome: #151b20; --chrome2: #1c2329; --ink: #e2e8ee; --ink2: #93a0ad; --line: #29323a; --accent: #5aa2ff; --accent-ink: #06121f; --warn: #f0b04a; --danger: #ff6b5e; --hover: rgba(90, 162, 255, .1); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: grid; grid-template-rows: 46px 1fr 28px; grid-template-columns: 256px 1fr; grid-template-areas: "top top" "side main" "foot foot"; font-family: var(--f); font-size: 14px; background: var(--bg); color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
#top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--chrome); border-bottom: 1px solid var(--line); z-index: 20; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 18px/1 var(--fc); letter-spacing: .01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.brand em { font-style: normal; color: var(--accent); }
#pname { font: 500 14px var(--f); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; width: 220px; }
#pname:hover { border-color: var(--line); } #pname:focus { border-color: var(--accent); outline: none; background: var(--chrome2); }
.tb { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.tb .sep { width: 1px; height: 22px; background: var(--line); margin: 0 8px; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; color: var(--ink); padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.tbtn:hover { background: var(--hover); }
.tbtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tbtn.icon span { display: none; }
#zoomPct { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 13px; }

/* ---------- side panel ---------- */
#side { grid-area: side; background: var(--chrome); border-right: 1px solid var(--line); overflow-y: auto; padding: 6px 0 20px; z-index: 10; }
#side section { padding: 10px 14px 12px; border-bottom: 1px solid var(--line); }
#side h2 { margin: 0 0 8px; font: 600 13px var(--f); color: var(--ink2); letter-spacing: .01em; }
.parts { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.part-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--chrome2); color: var(--ink); cursor: pointer; font-size: 12px; }
.part-btn svg { width: 50px; height: 22px; padding: 2px 4px; background: #ecebe5; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.part-btn:hover { border-color: var(--accent); }
.part-btn.on { border-color: var(--accent); background: var(--hover); box-shadow: inset 0 0 0 1px var(--accent); }
#partOpts:not(:empty) { margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--chrome2); color: var(--ink); border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); } .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fld { display: flex; flex-direction: column; gap: 3px; margin-top: 9px; font-size: 12.5px; color: var(--ink2); }
.fld input:not([type=range]), .fld select { font: 500 14px var(--f); color: var(--ink); background: var(--chrome2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.fld input:focus, .fld select:focus { border-color: var(--accent); outline: none; }
.fld b { color: var(--ink); font-weight: 600; }
.note { margin: 8px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--ink2); }
.muted { color: var(--ink2); font-size: 13px; line-height: 1.45; margin: 0; }
.swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--chrome); box-shadow: 0 0 0 1px var(--line); background: var(--c); cursor: pointer; }
.sw.yg { background: repeating-linear-gradient(45deg, #f0c419 0 5px, #2f9e46 5px 10px); }
.sw.ban { border-radius: 7px; width: 30px; height: 18px; margin-top: 4px; }
.sw.on { box-shadow: 0 0 0 2px var(--accent); }
.btn { border: 1px solid var(--line); background: var(--chrome2); color: var(--ink); border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); } .btn.danger:hover { border-color: var(--danger); }
#insp .btn.danger { margin-top: 12px; }
.ihead { font-weight: 700; font-size: 15px; display: flex; flex-direction: column; gap: 2px; }
.ihead span { font-weight: 500; font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.btn.tool { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; }
.btn.tool svg { width: 40px; height: 22px; flex: none; padding: 1px 3px; background: #ecebe5; border-radius: 4px; }
.btn.tool + .note { margin-bottom: 10px; }
#cables .split { fill: #1d1f22; stroke: #000; stroke-width: 1; pointer-events: none; }
#cables .plug.free { pointer-events: none; opacity: .95; }
#cables .ghost { opacity: .6; pointer-events: none; }

/* ---------- workspace ---------- */
#vp { grid-area: main; position: relative; overflow: hidden; background-color: var(--mat); background-image: linear-gradient(var(--matl) 1px, transparent 1px), linear-gradient(90deg, var(--matl) 1px, transparent 1px), radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, .06), transparent 70%); background-size: 40px 40px, 40px 40px, 100% 100%; cursor: default; touch-action: none; user-select: none; -webkit-user-select: none; }
#vp.panning, #vp.grab { cursor: grabbing; }
#vp[data-tool="place"] .board, #vp[data-tool="adapter"] .bnc { cursor: copy; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#cables { position: absolute; left: -4000px; top: -4000px; width: 10000px; height: 10000px; pointer-events: none; z-index: 50; overflow: visible; }
#cables .cable path.bo, #cables .cable path.bi, #cables .cable path.co { fill: none; pointer-events: visibleStroke; stroke-linecap: round; cursor: pointer; }
#cables .bo { stroke: rgba(0, 0, 0, .38); stroke-width: 7.5; }
#cables .bi { stroke-width: 5; }
#cables .co { stroke: #121314; stroke-width: 9; }
#cables .ci { fill: none; stroke: #3d4044; stroke-width: 2.5; pointer-events: none; }
#cables .plug { stroke: rgba(0, 0, 0, .5); stroke-width: 1.5; pointer-events: all; cursor: crosshair; }
#cables .plughole { fill: #111; pointer-events: none; }
#cables .bncplug { fill: #c9cdd1; stroke: #686e74; stroke-width: 2.5; pointer-events: all; cursor: pointer; }
#cables .bncplug2 { fill: #2b2d30; pointer-events: none; }
#cables .cable.sel .bi, #cables .cable.sel .co { filter: drop-shadow(0 0 5px var(--accent)); }
#cables .cable:hover .bo, #cables .cable:hover .co { stroke: var(--accent); }
#vp.on-board #cables .cable { opacity: .28; transition: opacity .15s; }
#cables .cable { transition: opacity .25s; }
#cables .pv { fill: none; stroke-width: 4.5; stroke-dasharray: 7 6; opacity: .85; }
#cables .pv.coaxpv { stroke-width: 7; }
#cables .pvend { opacity: .75; }

/* ---------- instruments ---------- */
.dev { position: absolute; z-index: 2; }
.dev.dragging, .board.dragging { z-index: 30; }
.dev-body { position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(180deg, #e6e9ec 0%, #d4d8dc 60%, #c8cdd1 100%); border: 1px solid #97a0a8; box-shadow: inset 0 1px 0 #fff, 0 14px 34px rgba(0, 0, 0, .32), 0 2px 5px rgba(0, 0, 0, .3); font-family: var(--fc); }
.dev-hmo .dev-body { background: linear-gradient(180deg, #dfe3e6, #cfd4d8); }
.dev-tag, .board > .dev-tag { position: absolute; left: 10px; top: -31px; height: 31px; display: flex; align-items: center; gap: 9px; padding: 0 6px 0 12px; background: var(--chrome); color: var(--ink); border: 1px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; cursor: grab; white-space: nowrap; font-size: 14px; }
.dev-tag:active { cursor: grabbing; }
.dt-name { font-weight: 700; } .dt-sub { color: var(--ink2); font-size: 13px; }
.dt-focus { border: none; background: none; color: var(--ink2); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 5px; }
.dt-focus:hover { background: var(--hover); color: var(--accent); }

/* keys */
.k { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; border-radius: 4px; border: 1px solid #98a0a7; background: linear-gradient(#f3f4f5, #d6dade); box-shadow: 0 1.6px 0 #7b838a, 0 2.5px 3px rgba(0, 0, 0, .22); font: 700 8px/1.02 var(--fc); color: #29313a; cursor: pointer; text-align: center; letter-spacing: .01em; transition: background .09s, box-shadow .09s, color .09s; overflow: visible; }
.k:hover { border-color: #5f6a74; }
.k.down { transform: translateY(1.5px); box-shadow: 0 0 0 #7b838a, 0 1px 1px rgba(0, 0, 0, .2); }
.k .kl { pointer-events: none; }
.k .ks { position: absolute; left: 100%; margin-left: 4px; top: 1px; font-size: 6.5px; font-weight: 700; color: #3f4850; text-align: left; line-height: 1.1; pointer-events: none; }
.k.xs { font-size: 7.2px; } .k.xxs { font-size: 6.4px; }
.k.sm { font-size: 7.6px; }
.k.num { font-size: 11px; background: linear-gradient(#fff, #e9ecee); }
.k.unit { font-size: 8.5px; }
.k.wave { font-size: 11px; letter-spacing: -.04em; }
.k.arr { font-size: 9px; color: #39424b; background: linear-gradient(#f4f5f6, #d9dde0); }
.k.round { border-radius: 50%; }
.k.soft { background: linear-gradient(#d3d7da, #b7bdc2); border-color: #858e96; }
.k.pill { border-radius: 12px; }
.k.fk { font-size: 7.6px; }
.k.lit { color: #0e1318; }
.k.lit.white { background: radial-gradient(#ffffff 55%, #eef6ff); border-color: #fff; color: #000; box-shadow: 0 0 0 1px #c9d3dc, 0 0 12px 4px rgba(255, 255, 255, 1), 0 0 22px 6px rgba(205, 228, 255, .85), 0 1.6px 0 #7b838a; }
.k.lit.green { background: radial-gradient(#d4ffd9, #43e060 85%); box-shadow: 0 0 10px 2px rgba(64, 230, 96, .85), 0 1.6px 0 #2d8a3f; border-color: #2d8a3f; }
.k.lit.blue { background: radial-gradient(#d6e9ff, #3b8cff 85%); box-shadow: 0 0 10px 2px rgba(59, 140, 255, .85), 0 1.6px 0 #1d5bb5; border-color: #1d5bb5; }
.k.lit.red { background: radial-gradient(#ffd6d2, #ff3b2f 85%); box-shadow: 0 0 10px 2px rgba(255, 59, 47, .85), 0 1.6px 0 #a3241c; border-color: #a3241c; }
.k.lit.yellow { background: radial-gradient(#fff6c2, #ffd21f 85%); box-shadow: 0 0 10px 2px rgba(255, 210, 31, .9), 0 1.6px 0 #a88a10; }
.k.lit.cyan { background: radial-gradient(#d4f4ff, #34c6ff 85%); box-shadow: 0 0 10px 2px rgba(52, 198, 255, .85), 0 1.6px 0 #1a7fa8; }
.k.lit.magenta { background: radial-gradient(#ffd8ea, #ff5ca8 85%); box-shadow: 0 0 10px 2px rgba(255, 92, 168, .85), 0 1.6px 0 #a83c6e; }
.k.lit.orange { background: radial-gradient(#ffe4c4, #ff9a2a 85%); box-shadow: 0 0 10px 2px rgba(255, 154, 42, .85); }
.k.lit.strong { outline: 2px solid rgba(255, 255, 255, .9); outline-offset: 1px; }
.k.lit.blink { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { filter: brightness(.55); box-shadow: none; } }
.k.pwr { background: linear-gradient(#e2554f, #a61b18); border-color: #6d100e; color: #fff; }
.k.pwr.lit { background: radial-gradient(#ffb0aa, #ff3b2f 80%); box-shadow: 0 0 9px 2px rgba(255, 70, 60, .7), 0 1.6px 0 #6d100e; }
.k.pwr2 { border-radius: 8px; font-size: 15px; color: #39424b; }
.k.pwr2.lit { color: #0f8a2c; box-shadow: 0 0 0 2px #37d35c, 0 0 9px 2px rgba(55, 211, 92, .6); background: linear-gradient(#fdfdfd, #e2e5e8); }
.k.pwr-round { border-radius: 50%; font-size: 13px; color: #39424b; }
.k.pwr-round.lit.red { color: #fff; }
.k.pwr-round.lit.pwr-on { color: #0e7e2a; box-shadow: 0 0 0 2px #39d65e, 0 0 9px rgba(57, 214, 94, .7); background: linear-gradient(#fdfdfd, #e2e5e8); }

/* knobs */
.knob { position: absolute; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #6f777e, #2a2f34 72%); box-shadow: 0 3px 7px rgba(0, 0, 0, .45), inset 0 1px 1px rgba(255, 255, 255, .3); cursor: ns-resize; touch-action: none; }
.knob .kcap { position: absolute; inset: 11%; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #8c9399, #3b4146 76%); box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .45), inset 0 1px 1px rgba(255, 255, 255, .25); transition: transform .06s; }
.knob .kmark { position: absolute; left: 50%; top: 5%; width: 2.2px; height: 26%; background: #eef1f3; border-radius: 1px; transform: translateX(-50%); }
.knob.hmp-knob, .knob.gen-knob, .knob.dmm-knob, .knob.uni { background: radial-gradient(circle at 50% 35%, #fafbfb, #b6bcc1 70%, #8d949a); }
.knob.hmp-knob .kcap, .knob.gen-knob .kcap, .knob.dmm-knob .kcap, .knob.uni .kcap { inset: 9%; background: conic-gradient(from 0deg, #e7eaec, #cdd2d6, #f7f8f9, #c4c9cd, #eef0f2, #d0d4d8, #e7eaec); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.knob.hmp-knob .kmark, .knob.gen-knob .kmark, .knob.dmm-knob .kmark, .knob.uni .kmark { background: #4a5259; width: 3px; height: 18%; }

/* jacks */
.jack { position: absolute; width: 30px; height: 30px; border-radius: 50%; cursor: crosshair; z-index: 3; }
.jack.ban { background: radial-gradient(circle at 45% 38%, var(--jc1), var(--jc2) 78%); box-shadow: 0 2px 3px rgba(0, 0, 0, .45), inset 0 1px 1px rgba(255, 255, 255, .35); }
.jack i { position: absolute; inset: 9px; border-radius: 50%; background: radial-gradient(circle, #050505 45%, #2c2c2c 70%); box-shadow: 0 0 0 1.6px #b48a3c; pointer-events: none; }
.jack.red { --jc1: #ff6a5c; --jc2: #b51a14; } .jack.black { --jc1: #5a5d61; --jc2: #141516; } .jack.blue { --jc1: #5f93f2; --jc2: #0c449c; }
.jack.gy { --jc1: #f3f3f3; --jc2: #8e959b; } .jack.blue-ring { --jc1: #4a86ea; --jc2: #0a3a8c; }
.jack.blue-ring i { inset: 7px; box-shadow: 0 0 0 3px #121314, 0 0 0 4.5px #b48a3c; }
.jack.sock { --jc1: #4e5156; --jc2: #131416; }
.jack.sm { width: 24px; height: 24px; } .jack.sm i { inset: 7px; }
.jack:hover { box-shadow: 0 0 0 3px var(--accent), 0 2px 3px rgba(0, 0, 0, .4); }
.jack.pending { animation: pend 1s ease-in-out infinite; }
@keyframes pend { 50% { box-shadow: 0 0 0 5px #ffb300, 0 0 14px #ffb300; } }
.jack.bnc { width: 40px; height: 40px; background: radial-gradient(circle at 42% 36%, #fff0b8, #d2a43c 55%, #8c6516 80%); box-shadow: 0 2px 4px rgba(0, 0, 0, .45); cursor: pointer; }
.jack.bnc i { inset: 10px; background: radial-gradient(circle, #e5e5e5 14%, #1b1b1b 19%, #303030 56%, #b48a3c 62%, #6d5115 70%); box-shadow: none; }
.dev-hmf .jack.bnc { background: radial-gradient(circle at 42% 36%, #ffffff, #c4c9ce 55%, #7d848a 80%); }
.dev-hmf .jack.bnc i { background: radial-gradient(circle, #e5e5e5 14%, #1b1b1b 19%, #303030 56%, #a5abb1 62%, #6a7076 70%); }

/* panel graphics */
.pl { position: absolute; font: 700 8px/1.1 var(--fc); color: #333c45; white-space: nowrap; pointer-events: none; letter-spacing: .02em; }
.pl.xs { font-size: 7.4px; } .pl.big { font-size: 11px; line-height: 1; } .pl.xxs { font-size: 6.3px; } .pl.b { font-weight: 800; } .pl.center { text-align: center; } .pl.dig { color: #6b747c; font-weight: 600; }
.pl sub { font-size: 75%; }
.hameg { font-style: italic; font-weight: 900; color: #fff; background: #0a4f9f; padding: 0 5px; border-radius: 2px; letter-spacing: .1em; font-size: 9px; }
.pnl-logo { position: absolute; font: 700 9px/1.35 var(--fc); color: #1e2a36; }
.pnl-logo span { font-weight: 700; } .pnl-logo .sm { font-size: 8px; color: #4a5560; }
.pnl-rs { position: absolute; font: 700 8.5px/1.4 var(--fc); color: #1e2a36; letter-spacing: .03em; }
.pnl-rs.big { font-size: 9.5px; }
.pnl-model { position: absolute; font: 800 12px/1.15 var(--fc); color: #222d38; letter-spacing: .02em; }
.pnl-model span { font-weight: 700; font-size: 8.5px; color: #47525d; letter-spacing: .06em; }
.pnl-model.wide { font-size: 9px; letter-spacing: .08em; }
.pnl-model.wide b { font-size: 11px; }
.pnl-model.sc b { font-size: 15px; }
.lcd-wrap { position: absolute; background: linear-gradient(#2d3236, #1c2023); border-radius: 5px; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .6); }
.tft, .dmm-screen, .bezel { position: absolute; background: #121417; border-radius: 6px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .8), 0 0 0 2px #6d757c; }
.bezel { background: #17191c; border-radius: 8px; }
canvas.scr { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 2px; background: #000; }
.area { position: absolute; border: 1.6px solid #8996a2; border-radius: 9px; background: rgba(255, 255, 255, .16); pointer-events: none; }
.tled { position: absolute; width: 24px; height: 16px; border-radius: 3px; background: #3a3f44; border: 1px solid #1e2124; display: flex; align-items: center; justify-content: center; }
.tled.on { background: #42ff70; box-shadow: 0 0 9px #42ff70; }
.tled.slope i { font-style: normal; font-size: 11px; color: #8b939a; }
.tled.slope.on { background: #4da3ff; box-shadow: 0 0 7px #4da3ff; } .tled.slope.on i { color: #fff; }
.chled { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #50565c; }
.chled.on { background: var(--c); box-shadow: 0 0 7px var(--c); }
.usb { position: absolute; width: 34px; height: 14px; background: #2d3135; border-radius: 2px; box-shadow: inset 0 0 0 3px #9aa1a7; }
.usb.v { width: 14px; height: 30px; }
.pod { position: absolute; background: repeating-linear-gradient(90deg, #2a2d30 0 4px, #555a5f 4px 6px); border-radius: 3px; }
.ctj { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(#111 35%, #6c7277 40%, #2e3236 75%); }
.adj { position: absolute; display: flex; gap: 6px; } .adj i { width: 6px; height: 16px; background: linear-gradient(90deg, #8d6d2a, #f2d488, #8d6d2a); border-radius: 1px; }
.rem { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #454b50; }
.dmm-fbox, .kp-box { position: absolute; border: 1.5px solid #8794a0; border-radius: 9px; background: rgba(255, 255, 255, .14); pointer-events: none; }
.dmm-strip { position: absolute; height: 14px; border-radius: 3px; background: #bcc3c9; font: 800 7.4px/14px var(--fc); color: #2c343c; text-align: center; letter-spacing: .06em; }
.dmm-strip.blue { background: #c2d3e8; }
.fuse-cap { position: absolute; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 45% 40%, #4c5156, #15171a 75%); box-shadow: 0 2px 3px rgba(0, 0, 0, .45); }
.fuse-cap::after { content: ""; position: absolute; left: 7px; right: 7px; top: 14px; height: 4px; background: #0a0b0c; border-radius: 2px; }
.hmp-group { position: absolute; border: 1.3px solid #8f9ba6; border-radius: 9px; pointer-events: none; }
.hmp-gnd-lbl { position: absolute; font-size: 11px; color: #39424b; }

/* adapters */
.adapter { position: absolute; width: 58px; height: 50px; z-index: 6; cursor: pointer; }
.ad-stem { position: absolute; left: 21px; top: -14px; width: 16px; height: 18px; background: linear-gradient(90deg, #8d949a, #eceff1, #8d949a); border-radius: 2px; }
.ad-body { position: absolute; left: 0; right: 0; top: 2px; bottom: 0; background: linear-gradient(#34383c, #1b1d20); border-radius: 7px; box-shadow: 0 4px 7px rgba(0, 0, 0, .45); }
.ad-body span { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font: 700 7px var(--fc); color: #a9b0b6; letter-spacing: .1em; }
.adapter.sel .ad-body { box-shadow: 0 0 0 2px var(--accent), 0 4px 7px rgba(0, 0, 0, .45); }

/* board */
.board { position: absolute; z-index: 1; }
.board > svg { position: absolute; left: 0; top: 0; overflow: visible; }
.b-static { filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .3)); }
.b-static .plate { fill: #efede6; stroke: #a8a495; stroke-width: 2; }
.b-static .field { fill: #e8e6de; } .b-static .field.dark { fill: #e1ded3; }
.b-static .strip.r { stroke: rgba(210, 48, 40, .55); stroke-width: 2; }
.b-static .strip.k { stroke: rgba(30, 30, 30, .38); stroke-width: 2; }
.b-static .hole { fill: #262729; }
.b-static .num { font: 700 11px var(--fc); fill: #6a665b; text-anchor: middle; }
.b-static .row { font: 800 13px var(--fc); fill: #4c4940; text-anchor: middle; }
.b-static .strap { stroke: #9c968a; stroke-width: 2.6; }
.b-static .brand { font: 700 9px var(--fc); letter-spacing: .35em; fill: #aaa596; text-anchor: middle; }
.b-parts .leg { stroke: #a5abb1; stroke-width: 1.8; fill: none; stroke-linecap: round; }
.b-parts .pin { fill: #c9cdd2; stroke: #555; stroke-width: .5; }
.ptxt { font: 700 5.6px var(--fc); text-anchor: middle; fill: #3b2a00; pointer-events: none; }
.ptxt.lt { fill: #e3e5e8; font-size: 7.5px; letter-spacing: .04em; } .ptxt.dk { fill: #1e3a66; font-size: 9px; }
.vlbl { font: 700 10px var(--fc); text-anchor: middle; fill: #26303a; paint-order: stroke; stroke: #efede6; stroke-width: 3px; pointer-events: none; }
.part { cursor: pointer; }
.part.sel { filter: drop-shadow(0 0 2px #0b5cad) drop-shadow(0 0 4px #0b5cad); }
.part.hot { animation: hot .7s ease-in-out infinite alternate; }
@keyframes hot { from { filter: drop-shadow(0 0 1px #ff5a1f); } to { filter: drop-shadow(0 0 7px #ff3b1f) drop-shadow(0 0 3px #ff9b1f); } }
.part.ghost, .wire.ghost { opacity: .55; pointer-events: none; }
.glow { filter: blur(4px); pointer-events: none; }
.wire { cursor: pointer; }
.wire .wo { stroke: rgba(0, 0, 0, .45); stroke-width: 4.8; fill: none; stroke-linecap: round; }
.wire .wi { stroke-width: 3.1; fill: none; stroke-linecap: round; }
.wire.sel .wi { filter: drop-shadow(0 0 3px #0b5cad); }
.b-ovl { pointer-events: none; }
.b-ovl .hl { fill: rgba(11, 92, 173, .22); stroke: rgba(11, 92, 173, .75); stroke-width: 1; }
.b-ovl .hl2 { fill: none; stroke: #0b5cad; stroke-width: 2; } .b-ovl .hl2.busy { stroke: #d32f2f; }
.b-ovl .pvline { stroke: #0b5cad; stroke-dasharray: 4 3; stroke-width: 1.5; }
.vlbl.err { fill: #d32f2f; font-size: 18px; }

/* ---------- status, tips, toasts ---------- */
#status { grid-area: foot; display: flex; align-items: center; gap: 18px; padding: 0 12px; background: var(--chrome); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; z-index: 20; }
#hint { overflow: hidden; text-overflow: ellipsis; }
#warn { color: var(--warn); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
#simInfo { margin-left: auto; font-variant-numeric: tabular-nums; }
#tip { position: fixed; z-index: 100; transform: translate(-50%, -100%); background: #10161c; color: #f2f5f8; padding: 4px 8px; border-radius: 5px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .12s; white-space: nowrap; }
#tip.show { opacity: 1; }
#toast { position: fixed; z-index: 100; bottom: 44px; left: 50%; transform: translate(-50%, 8px); background: var(--ink); color: var(--bg); padding: 9px 15px; border-radius: 8px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: var(--danger); color: #fff; }

/* ---------- dialogs ---------- */
dialog { border: none; border-radius: 14px; padding: 0; background: var(--chrome); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, .4); width: min(480px, 92vw); max-height: 92vh; overflow-y: auto; }
dialog input[type=range] { accent-color: var(--accent); width: 160px; }
dialog::backdrop { background: rgba(8, 12, 16, .45); }
.dlg header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px; }
.dlg h2 { margin: 0; font: 700 19px var(--fc); }
.dlg h3 { margin: 14px 0 0; padding: 0 18px; font: 600 13px var(--f); color: var(--ink2); }
.dlg .x { border: none; background: none; color: var(--ink2); font-size: 16px; cursor: pointer; padding: 6px; border-radius: 6px; }
.dlg .x:hover { background: var(--hover); }
.dlg .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 18px; }
.dlg > .btn { margin: 8px 18px 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: none; color: var(--ink); padding: 6px 11px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.tog { display: flex; gap: 10px; align-items: flex-start; padding: 9px 18px 0; cursor: pointer; }
.tog input { margin-top: 3px; accent-color: var(--accent); }
.tog small { display: block; color: var(--ink2); font-size: 12.5px; margin-top: 2px; line-height: 1.4; }
.dlg footer { margin-top: 16px; padding: 12px 18px 14px; border-top: 1px solid var(--line); color: var(--ink2); font-size: 12.5px; display: flex; justify-content: space-between; }
.plist { list-style: none; margin: 8px 0 14px; padding: 0 18px; max-height: 50vh; overflow: auto; }
.plist li { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.plist li div { flex: 1; display: flex; flex-direction: column; } .plist small { color: var(--ink2); }
.dlg > .muted { padding: 6px 18px 20px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>'use strict';
/* PocketBench — utilities */
const PB = window.PB = {};
PB.VERSION = '1.1.0';
PB.BUILD = '2026-11-05';

PB.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
PB.gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
PB.uid = (p = 'i') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
PB.nextPow2 = (x) => (!(x > 1) ? 1 : x >= 2 ** 30 ? 2 ** 30 : 2 ** Math.ceil(Math.log2(x) - 1e-12));
PB.html = (s) => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstElementChild; };
PB.esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const PREF = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
/* format with SI prefix, sig = significant digits */
PB.si = (v, unit = '', sig = 4, space = true) => {
  if (v === null || v === undefined || !isFinite(v)) return '---';
  const sp = space ? ' ' : '';
  if (v === 0) return '0' + sp + unit;
  const a = Math.abs(v);
  for (const [m, p] of PREF) {
    if (a >= m * 0.99995) {
      let s = (v / m).toPrecision(sig);
      if (s.includes('e')) s = String(Math.round(v / m));
      return s + sp + p + unit;
    }
  }
  return (v / 1e-12).toPrecision(sig) + sp + 'p' + unit;
};
/* short form without trailing zeros: 2.2kΩ */
PB.siShort = (v, unit) => PB.si(v, unit, 4, false).replace(/(\.\d*?)0+(?=[^\d]|$)/, '$1').replace(/\.(?=[^\d]|$)/, '');
/* fixed number of decimals after choosing prefix */
PB.siFix = (v, unit, dec) => {
  if (!isFinite(v)) return '---';
  const a = Math.abs(v);
  let m = 1, p = '';
  for (const [mm, pp] of PREF) { if (a >= mm * 0.9999995) { m = mm; p = pp; break; } m = mm; p = pp; }
  return (v / m).toFixed(dec) + ' ' + p + unit;
};
/* parse "2k2", "4.7k", "100n", "10µ", "1M", "47" */
PB.parseSI = (s) => {
  if (typeof s === 'number') return s;
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/,/g, '.').replace(/\s+/g, '');
  s = s.replace(/(ohms?|Ω|Hz|F|H|V|A|W|s)$/i, (m) => (m === 'm' ? m : ''));
  const r = /^([+-]?\d*\.?\d+(?:e[+-]?\d+)?)([pnuµmkKMG]?)(\d*)$/.exec(s);
  if (!r) return NaN;
  const mult = { p: 1e-12, n: 1e-9, u: 1e-6, 'µ': 1e-6, m: 1e-3, '': 1, k: 1e3, K: 1e3, M: 1e6, G: 1e9 }[r[2]];
  let num = parseFloat(r[1]);
  if (r[3]) num = parseFloat(r[1] + '.' + r[3]);
  return num * mult;
};

/* ---------- FFT (in place, radix 2) ---------- */
PB.fft = (re, im, inv = false) => {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (2 * Math.PI / len) * (inv ? 1 : -1);
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ar = re[i + k], ai = im[i + k];
        const br = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
        const bi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ar + br; im[i + k] = ai + bi;
        re[i + k + len / 2] = ar - br; im[i + k + len / 2] = ai - bi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
  if (inv) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
};

/* ---------- dense LU with partial pivoting ---------- */
PB.lu = (A, n) => {
  const p = new Int32Array(n);
  for (let i = 0; i < n; i++) p[i] = i;
  for (let k = 0; k < n; k++) {
    let mx = 0, piv = k;
    for (let i = k; i < n; i++) { const v = Math.abs(A[i * n + k]); if (v > mx) { mx = v; piv = i; } }
    if (mx < 1e-300) { A[k * n + k] = 1e-18; piv = k; }
    if (piv !== k) {
      for (let j = 0; j < n; j++) { const t = A[k * n + j]; A[k * n + j] = A[piv * n + j]; A[piv * n + j] = t; }
      const t = p[k]; p[k] = p[piv]; p[piv] = t;
    }
    const akk = A[k * n + k];
    for (let i = k + 1; i < n; i++) {
      const f = (A[i * n + k] /= akk);
      if (f !== 0) for (let j = k + 1; j < n; j++) A[i * n + j] -= f * A[k * n + j];
    }
  }
  return p;
};
PB.luSolve = (A, p, n, b, x) => {
  x = x || new Float64Array(n);
  for (let i = 0; i < n; i++) x[i] = b[p[i]];
  for (let i = 0; i < n; i++) { let s = x[i]; for (let j = 0; j < i; j++) s -= A[i * n + j] * x[j]; x[i] = s; }
  for (let i = n - 1; i >= 0; i--) { let s = x[i]; for (let j = i + 1; j < n; j++) s -= A[i * n + j] * x[j]; x[i] = s / A[i * n + i]; }
  return x;
};
/* complex dense solve (Gauss) — re/im arrays n*n, b re/im */
PB.csolve = (Ar, Ai, br, bi, n) => {
  for (let k = 0; k < n; k++) {
    let mx = 0, piv = k;
    for (let i = k; i < n; i++) { const v = Ar[i * n + k] ** 2 + Ai[i * n + k] ** 2; if (v > mx) { mx = v; piv = i; } }
    if (mx < 1e-300) { Ar[k * n + k] = 1e-18; mx = 1e-36; piv = k; }
    if (piv !== k) {
      for (let j = 0; j < n; j++) {
        let t = Ar[k * n + j]; Ar[k * n + j] = Ar[piv * n + j]; Ar[piv * n + j] = t;
        t = Ai[k * n + j]; Ai[k * n + j] = Ai[piv * n + j]; Ai[piv * n + j] = t;
      }
      let t = br[k]; br[k] = br[piv]; br[piv] = t; t = bi[k]; bi[k] = bi[piv]; bi[piv] = t;
    }
    const pr = Ar[k * n + k], pi = Ai[k * n + k], d = pr * pr + pi * pi;
    for (let i = k + 1; i < n; i++) {
      const ar = Ar[i * n + k], ai = Ai[i * n + k];
      if (ar === 0 && ai === 0) continue;
      const fr = (ar * pr + ai * pi) / d, fi = (ai * pr - ar * pi) / d;
      for (let j = k; j < n; j++) {
        const xr = Ar[k * n + j], xi = Ai[k * n + j];
        Ar[i * n + j] -= fr * xr - fi * xi; Ai[i * n + j] -= fr * xi + fi * xr;
      }
      br[i] -= fr * br[k] - fi * bi[k]; bi[i] -= fr * bi[k] + fi * br[k];
    }
  }
  const xr = new Float64Array(n), xi = new Float64Array(n);
  for (let i = n - 1; i >= 0; i--) {
    let sr = br[i], si = bi[i];

      for (const a of p.adapters) { nl.union(a.id + '.r', a.port); nl.union(a.id + '.k', 'GND'); }
      for (const c of p.comps) {
        const n = c.pins.map((h) => hole(h).node);
        const v = c.v * (p.tol ? c.tf || 1 : 1);
        switch (c.type) {
          case 'R': nl.add({ t: 'R', n, rv: v, tag: c.id }); break;
          case 'C': nl.add({ t: 'C', n, c: v, tag: c.id }); if (c.ckind === 'elec') nl.add({ t: 'R', n, rv: 5e7 }); break;
          case 'L': nl.add({ t: 'L', n, l: v, rs: Math.max(c.rs || 0, 1e-3), tag: c.id }); break;
          case 'D': case 'LED': case 'Z': nl.add({ t: 'D', n, m: PB.DIODES[c.model], tag: c.id }); break;
          case 'OA': nl.add({ t: 'OA', n: [n[2], n[1], n[6], n[3], n[5]], tag: c.id }); break;
          case 'POT': nl.add({ t: 'R', n: [n[0], n[1]], rv: Math.max(0.5, v * c.pos) }); nl.add({ t: 'R', n: [n[1], n[2]], rv: Math.max(0.5, v * (1 - c.pos)) }); break;
        }
      }
      for (const d of this.devList) d.stamp(nl, ctx);
      return nl;
    }
    solve(now) {
      const p = this.proj;
      const gen = this.devices.hmf.simSource(now);
      const shielded = {}; for (let i = 1; i <= 4; i++) shielded['scope.ch' + i] = !p.adapters.some((a) => a.port === 'scope.ch' + i);
      const ctx = { ideal: p.ideal, gen, shielded };
      const nl = this.buildNetlist(ctx); ctx.nl = nl;
      let N = 2048, T = null;
      if (gen) {
        T = gen.T;
        const ho = this.devices.hmo;
        if (ho.state.on) { const tb = ho.state.zoom.on ? ho.state.tb / ho.state.zoom.f : ho.state.tb; N = PB.clamp(PB.nextPow2(T / (tb * 12 / 600)), 1024, 16384); }
        if (gen.cycles > 1) N = PB.clamp(PB.nextPow2(gen.cycles * 64), N, 65536);
        if (gen.noise) N = Math.max(N, 4096);
      }
      let sol;
      try { sol = PB.solve(nl, { T, N, Nnl: Math.min(N, 2048), budget: 350 }); }
      catch (err) { console.error(err); return; }
      this.sol = sol; this.nl = nl;
      for (const d of this.devList) d.onSolve(sol, ctx);
      // component checks
      const hot = new Set(), led = new Map(), warns = [];
      for (const c of p.comps) {
        const n = c.pins.map((h) => hole(h).node);
        if (c.type === 'R') { const w = sol.diff(n[0], n[1]); let s2 = 0; for (const x of w) s2 += x * x; const P = s2 / w.length / (c.v * (p.tol ? c.tf || 1 : 1)); const rate = c.pw || 0.25; if (P > rate) { hot.add(c.id); warns.push(t('warn.hot', { n: 'R ' + PB.si(c.v, 'Ω', 3, false), p: PB.si(P, 'W', 3, false), r: rate + ' W' })); } }
        if (c.type === 'C' && c.ckind === 'elec') { const m = PB.wstats(sol.diff(n[0], n[1])).mean; if (m < -0.5) { hot.add(c.id); warns.push(t('warn.elec', { n: 'C ' + PB.si(c.v, 'F', 3, false) })); } }
        if (c.type === 'LED') led.set(c.id, PB.clamp(sol.diodeCurrent(c.id) / 0.012, 0, 1));
      }
      const changed = JSON.stringify([...hot]) !== JSON.stringify([...(this.rtHot || [])]) || JSON.stringify([...led]) !== JSON.stringify([...(this.rtLed || [])]);
      this.rtHot = hot; this.rtLed = led;
      if (changed) this.renderParts();
      $('#warn').textContent = warns[0] || '';
      $('#simInfo').textContent = t('st.sim', { ms: sol.ms.toFixed(0) }) + (T ? ` · T = ${PB.si(T, 's', 3, false)}` : ' · DC');
    }
    loop(now) {
      if (this.isDirty && now - this.lastSolve > 35) { this.isDirty = false; this.lastSolve = now; this.solve(now); }
      for (const d of this.devList) { const bt = d.state.on && d.booting(); if (d.rt.wasBoot && !bt) { d.rt.needDraw = true; d.rt.lastAcq = 0; } d.rt.wasBoot = bt; d.tick(now); d.render(); }
      if (this.saveDue && now > this.saveDue) { this.saveDue = 0; this.autosave(); }
      requestAnimationFrame((n) => this.loop(n));
    }
  }
  PB.App = App;
  PB.boardGeom = { hole, hid, nearestHole };
  window.addEventListener('DOMContentLoaded', () => { PB.app = new App(); });
})();

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (PB.app) PB.app.devList.forEach((d) => (d.rt.needDraw = true)); });
</script>
</body>
</html>
